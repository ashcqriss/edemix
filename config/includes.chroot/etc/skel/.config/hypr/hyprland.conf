# Edemint — default Hyprland config
# Tuned for low-end hardware (1GB RAM class) by default.
# Eye-candy lives behind one toggle: flip $low_power to false on capable machines.

$low_power = true

#############################
# Monitors / AR glasses
#############################
# AR glasses (RayNeo Air, Xreal, etc.) connect over USB-C DisplayPort and show
# up as an ordinary monitor. List them here, or leave the catch-all below which
# mirrors/extends whatever is plugged in at its preferred mode.
#
# Find names with:  hyprctl monitors   (or `wlr-randr`)
# Example for glasses running 1920x1080@60 placed to the right of the laptop:
#   monitor = DP-1, 1920x1080@60, 1920x0, 1
monitor = , preferred, auto, 1

#############################
# Autostart
#############################
exec-once = waybar
exec-once = mako
exec-once = swaybg -c 14161c

#############################
# Input
#############################
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

#############################
# Look & feel
#############################
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 8
    # Blur is the single biggest GPU/RAM cost — off in low-power mode.
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    # Disabled on low-end by default. Set $low_power = false above and flip this.
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true   # variable refresh: saves power when idle
}

#############################
# Keybinds
#############################
$mod = SUPER

bind = $mod, Return, exec, foot
bind = $mod, D, exec, wofi --show drun
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, E, exec, thunar
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, L, exec, swaylock

# focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

# media / brightness keys
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
