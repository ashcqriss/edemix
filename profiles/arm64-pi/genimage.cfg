# Edemint Raspberry Pi disk layout (§3).
# Two partitions on a hybrid MBR/GPT image:
#   1. FAT32 firmware partition (/boot/firmware) — Pi bootloader expects this
#   2. ext4 root partition (/)
#
# Sizing: 512MiB firmware, ~5GiB ext4 root (CI runs `parted resizepart` on
# first boot via cloud-init / a firstboot service so the partition expands
# to the SD/NVMe size).

image boot.vfat {
    vfat {
        # Files copied from the --inputpath dir (boot-firmware staging in build.sh)
        file config.txt   { image = "config.txt" }
        file cmdline.txt  { image = "cmdline.txt" }
        # Everything else from /boot/firmware (kernel images, dtbs, overlays)
        # comes via the rootfs sync below; mkfs.vfat will pick them up from
        # the same input dir if we glob them.
    }
    mountpoint = "/boot/firmware"
    size = 512M
}

image rootfs.ext4 {
    ext4 {
        label = "edemint-root"
    }
    mountpoint = "/"
    size = 5G
}

image edemint-0.1-arm64-rpi.img {
    hdimage {
        # MBR is what the Pi firmware expects on a flashable SD card.
        partition-table-type = "mbr"
    }

    partition firmware {
        partition-type = 0xc      # W95 FAT32 (LBA)
        image = "boot.vfat"
        bootable = true
    }
    partition root {
        partition-type = 0x83     # Linux
        image = "rootfs.ext4"
    }
}
