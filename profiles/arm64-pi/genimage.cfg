# Edemint Raspberry Pi disk layout (§3).
# Two partitions on a hybrid MBR/GPT image:
#   1. FAT32 firmware partition (/boot/firmware) — Pi bootloader expects this
#   2. ext4 root partition (/)
#
# boot.vfat is pre-built by build.sh (mkfs.vfat + loop-mount from
# $ROOTFS_DIR/boot/firmware/) and passed via --inputpath. genimage reads it
# as-is rather than building its own with a static file list.
#
# Sizing: 512MiB firmware, ~5GiB ext4 root (edemint-firstboot-growfs expands
# the root partition to fill the SD/NVMe on first boot).

image rootfs.ext4 {
    ext4 {
        label = "edemint-root"
    }
    mountpoint = "/"
    size = 5G
}

image edemint-0.1-arm64-rpi.img {
    hdimage {
        # MBR is what the Pi firmware expects on a flashable SD card.
        partition-table-type = "mbr"
    }

    partition firmware {
        partition-type = 0xc      # W95 FAT32 (LBA)
        image = "boot.vfat"
        bootable = true
    }
    partition root {
        partition-type = 0x83     # Linux
        image = "rootfs.ext4"
    }
}
