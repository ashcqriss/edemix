# Edemint effects profile.
#
# hyprland.conf sources this file AFTER its low-power defaults, so anything
# set here wins. Low-power (no blur / shadows / animations) stays the shipped
# default because the image targets Pi and 1GB-class hardware too.
#
# edemint-setup rewrites this file when you pick the "full" effects profile;
# you can also uncomment the block below by hand on capable machines.
#
# decoration {
#     blur {
#         enabled = true
#     }
#     shadow {
#         enabled = true
#     }
# }
# animations {
#     enabled = true
# }
