# Edemint effects profile — LOW-POWER BASELINE (shipped default).
#
# This is the safe default for Raspberry Pi and 1GB-class hardware: no blur,
# no shadow, no animation. It owns the decoration/animation keywords so the
# profile can be swapped wholesale. edemint-setup's "Full" choice rewrites this
# file to `source = ~/.config/hypr/glass.conf`, turning on the frosted/liquid
# glass look on capable hardware.
decoration {
    rounding = 16
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}
