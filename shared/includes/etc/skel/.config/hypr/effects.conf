# Edemint effects profile.
#
# hyprland.conf sources this file AFTER its low-power defaults, so anything
# set here wins. Low-power (no blur / shadows / animations) stays the shipped
# default because the image targets Pi and 1GB-class hardware too. The glass
# surfaces are tuned to stay legible WITHOUT blur (docs/DESIGN.md), so this
# file is an enhancement, never a requirement.
#
# edemint-setup rewrites this file when you pick the "full" effects profile;
# you can also uncomment the block below by hand on capable machines.
#
# decoration {
#     blur {
#         enabled = true
#         size = 8
#         passes = 3
#         vibrancy = 0.17
#     }
#     shadow {
#         enabled = true
#     }
# }
# animations {
#     enabled = true
# }
# # Lensing: blur behind the glass control layer (dock, status, launcher,
# # notifications, OSD, power overlay).
# layerrule = blur, ^(waybar|wofi|notifications|swayosd|logout_dialog)$
# layerrule = ignorezero, ^(waybar|wofi|notifications|swayosd|logout_dialog)$
