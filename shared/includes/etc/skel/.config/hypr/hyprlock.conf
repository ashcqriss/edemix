# Edemint first-build lock screen, based on the login_screen prototype.
# A real profile image remains intentionally absent until the artwork exists.

background {
    monitor =
    color = rgba(171e54ff)
    blur_passes = 0
}

# Time remains visible while locked, as specified by the prototype.
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(aea3ffff)
    font_size = 72
    position = 0, -48
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(74fbeaff)
    font_size = 18
    position = 0, -128
    halign = center
    valign = top
}

# The username occupies the label position above the optional password field.
label {
    monitor =
    text = $USER
    color = rgba(ffffffff)
    font_size = 28
    position = 0, 28
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    position = 0, -64
    halign = center
    valign = center
    placeholder_text = Enter password
    outline_thickness = 3
    rounding = 20
    dots_size = 0.22
    dots_spacing = 0.28
    inner_color = rgba(002c89ee)
    outer_color = rgba(74fbeaff)
    check_color = rgba(45e289ff)
    fail_color = rgba(e31515ff)
    font_color = rgba(ffffffff)
    fade_on_empty = false
}
