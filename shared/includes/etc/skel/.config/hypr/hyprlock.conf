# Edemint lock screen — login_screen hierarchy on liquid glass.
# Time and date stay visible while locked (top, always); a glass profile
# circle marks the identity slot (real profile artwork is still pending);
# the username sits below it with a compact capsule password field.

background {
    monitor =
    # Flat pure-black canvas (docs/DESIGN.md): no gradient, no wallpaper.
    color = rgba(000000ff)
    blur_passes = 0
}

# Time remains visible while locked, as specified by login_screen.
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(aea3ffff)
    font_size = 72
    position = 0, -48
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(74fbeaff)
    font_size = 18
    position = 0, -128
    halign = center
    valign = top
}

# Profile-picture slot: a circle of glass with a periwinkle rim. The real
# profile image replaces this once the identity artwork exists.
shape {
    monitor =
    size = 160, 160
    color = rgba(ffffff1a)
    rounding = -1
    border_size = 2
    border_color = rgba(6d58ffe6)
    position = 0, 150
    halign = center
    valign = center
}

# The username occupies the label position above the optional password field.
label {
    monitor =
    text = $USER
    color = rgba(ffffffff)
    font_size = 28
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    position = 0, -64
    halign = center
    valign = center
    placeholder_text = Enter password
    outline_thickness = 2
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.28
    inner_color = rgba(ffffff26)
    outer_color = rgba(74fbeaff)
    check_color = rgba(45e289ff)
    fail_color = rgba(e31515ff)
    font_color = rgba(ffffffff)
    fade_on_empty = false
}
