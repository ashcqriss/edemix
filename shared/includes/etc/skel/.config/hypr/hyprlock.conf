# Edemint hyprlock — placeholder visuals; design pass replaces colors/fonts.
# Functional behaviour (PAM auth, kill-resistant) is final.

background {
    monitor =
    color = rgba(14161cff)
    blur_passes = 0
}

input-field {
    monitor =
    size = 320, 48
    position = 0, -80
    halign = center
    valign = center
    placeholder_text = Password
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.5)
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    font_color = rgba(ffffffff)
    fade_on_empty = true
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ffffffff)
    font_size = 96
    position = 0, 200
    halign = center
    valign = center
}
