# Edemint Hyprland profile — device/user overrides.
#
# This file is sourced at the END of hyprland.conf, so plain
# `section:option = value` keywords here override the Liquid Glass defaults.
# edemint-setup rewrites this file from its effects chooser; edit freely.
#
# Default: Liquid Glass stays on (no overrides).
#
# Low-power profile (Pi, 1GB-class hardware) — uncomment to opt out of the
# glass while keeping the palette and rounded geometry:
# decoration:blur:enabled = false
# decoration:shadow:enabled = false
# animations:enabled = false
