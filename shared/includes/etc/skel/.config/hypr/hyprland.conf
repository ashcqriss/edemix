# Edemint default Hyprland config.
#
# The default look is Edemint Liquid Glass (docs/DESIGN.md): a flat, pure-black
# canvas with frosted, translucent shell surfaces floating over it, rounded
# geometry, and macOS-like spring animations. Low-power hardware (Pi,
# 1GB-class) opts out via ~/.config/hypr/profile.conf — see the bottom of this
# file and the edemint-setup effects chooser.

# Canonical shell palette (docs/PALETTE.md). The canvas is flat pure black —
# never a gradient, never an image by default. Bright blue leads the design.
$ed_canvas = rgba(000000ff)
$ed_surface = rgba(002c89ff)
$ed_primary = rgba(2001ffff)
$ed_primary_soft = rgba(6d58ffff)
$ed_accent = rgba(45e289ff)
$ed_focus = rgba(74fbeaff)

#############################
# Monitors / AR glasses
#############################
# AR glasses (RayNeo Air, Xreal, etc.) attach over USB-C DP-Alt and present as
# an ordinary monitor. kanshi applies named profiles automatically on hotplug;
# the catch-all below covers everything else.
monitor = , preferred, auto, 1

#############################
# Session env
#############################
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1
# Input method (fcitx5 for CJK et al)
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = GNOME_ACCESSIBILITY,1
env = QT_ACCESSIBILITY,1
# Mesa shader cache - first-launch latency wins for GL apps.
env = MESA_SHADER_CACHE_MAX_SIZE,2G
env = mesa_glthread,true
# NVIDIA env is set by edemint-nvidia-toggle.

#############################
# Autostart
#############################
# The pinned-app dock and top-right status region (glass surfaces, blurred via
# the layerrules below). The tap-in-void overlay, widgets, and the responsive
# mobile shell are intentionally deferred until the base system is stable.
exec-once = waybar -c ~/.config/waybar/config -s ~/.config/waybar/style.css
exec-once = waybar -c ~/.config/waybar/config-dock -s ~/.config/waybar/style-dock.css
exec-once = mako
# Flat pure-black canvas (docs/DESIGN.md: no gradient, no wallpaper by default).
exec-once = swaybg -c 000000
exec-once = kanshi
exec-once = hypridle
exec-once = swayosd-server
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = fcitx5 -d
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wlsunset -l 0 -L 0
# First-boot setup wizard (Wi-Fi, effects profile, AI opt-in, sync remote).
# Stamps itself after the first successful run; no-ops thereafter.
exec-once = foot -T "Edemint setup" -e edemint-setup
exec-once = edemint-welcome

#############################
# Input
#############################
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        drag_lock = true
        scroll_factor = 0.6
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 200
}

#############################
# Look & feel — Liquid Glass
#############################
general {
    gaps_in = 8
    gaps_out = 12
    border_size = 2
    # Bright-blue-led active border; blue-to-green is a sanctioned bright
    # cross-family transition (docs/PALETTE.md rules).
    col.active_border = $ed_primary $ed_accent 45deg
    col.inactive_border = rgba(002c8966)
    layout = dwindle
}

decoration {
    # Rounded rectangles are the Edemint shape language.
    rounding = 16

    # The glass: frost everything that is translucent (shell layers below,
    # and any window that carries alpha, e.g. the foot terminal).
    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.01
        contrast = 1.05
        brightness = 1.0
        vibrancy = 0.18
        popups = true
    }

    # Soft, large shadows lift the floating layer off the black canvas.
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000080)
    }
}

# Frost the shell's own layers so they read as liquid glass over the canvas
# and whatever windows sit beneath them.
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = blur, notifications
layerrule = ignorezero, notifications
layerrule = blur, swayosd
layerrule = ignorezero, swayosd
layerrule = blur, logout_dialog

animations {
    # macOS-like motion: surfaces materialize with a small spring overshoot,
    # workspaces glide, fades ease. Kept short so the shell feels quick.
    enabled = true

    bezier = edeSpring, 0.34, 1.4, 0.64, 1
    bezier = edeEase, 0.25, 1, 0.5, 1

    animation = windows, 1, 4, edeSpring, popin 90%
    animation = windowsOut, 1, 3, edeEase, popin 92%
    animation = windowsMove, 1, 4, edeEase
    animation = layers, 1, 3, edeSpring, popin 94%
    animation = fade, 1, 3, edeEase
    animation = border, 1, 6, edeEase
    animation = workspaces, 1, 4, edeEase, slidefade 12%
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x000000  # flat black behind everything, always
    vfr = true                # variable refresh on idle (power)
    vrr = 2                   # fullscreen-only VRR
    focus_on_activate = false # do not yank focus on toast/wake
}

#############################
# Keybinds
#############################
$mod = SUPER

# Apps
bind = $mod, Return, exec, foot
bind = $mod, D, exec, wofi --show drun
bind = $mod, E, exec, thunar
bind = $mod, A, exec, foot -T "Edemint AI" -e edemint-ai chat
bind = $mod, slash, exec, edemint-keybinds
bind = $mod SHIFT, slash, exec, edemint-keybinds

# Window management
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, L, exec, hyprlock

# Screenshot + clipboard + screen recording
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod SHIFT, R, exec, pkill -SIGINT wf-recorder || wf-recorder -g "$(slurp)" -f "$HOME/Videos/edemint-$(date +%Y%m%d-%H%M%S).mp4"

# Power menu
bind = $mod, Escape, exec, wlogout

# Accessibility - cursor zoom
binde = $mod, equal, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor -j | jq '.float + 0.1')"
binde = $mod, minus, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor -j | jq '.float - 0.1 | if . < 1 then 1 else . end')"
bind  = $mod, 0, exec, hyprctl keyword cursor:zoom_factor 1

# Focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

# Media / brightness - routed through swayosd for OSD feedback
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

#############################
# Device / user profile
#############################
# Sourced LAST so a profile can override anything above with plain
# `section:option = value` keywords (e.g. turn the glass off on low-power
# hardware). edemint-setup writes this file from its effects chooser.
source = ~/.config/hypr/profile.conf
