# Edemint default Hyprland config.
#
# Effects (blur, shadows, animations) are OFF by default for Pi and 1GB-class
# hardware; ~/.config/hypr/effects.conf re-enables them on capable machines.
# This is a first-build approximation; complete UI complexes and animations
# follow after the operating-system base is stable.

# Canonical first-build shell defaults. profile.conf mirrors docs/PALETTE.md and
# may override these values for a specific device or user.
$ed_background = rgba(171e54ff)
$ed_surface = rgba(002c89ff)
$ed_primary = rgba(2001ffff)
$ed_primary_soft = rgba(6d58ffff)
$ed_accent = rgba(45e289ff)
$ed_focus = rgba(74fbeaff)
source = ~/.config/hypr/profile.conf

#############################
# Monitors / AR glasses
#############################
# AR glasses (RayNeo Air, Xreal, etc.) attach over USB-C DP-Alt and present as
# an ordinary monitor. kanshi applies named profiles automatically on hotplug;
# the catch-all below covers everything else.
monitor = , preferred, auto, 1

#############################
# Session env
#############################
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland;xcb
# Qt reads the GTK settings (dark mode, fonts) through the gtk3 platform theme.
env = QT_QPA_PLATFORMTHEME,gtk3
env = MOZ_ENABLE_WAYLAND,1
# Input method (fcitx5 for CJK et al)
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = GNOME_ACCESSIBILITY,1
env = QT_ACCESSIBILITY,1
# Mesa shader cache - first-launch latency wins for GL apps.
env = MESA_SHADER_CACHE_MAX_SIZE,2G
env = mesa_glthread,true
# NVIDIA env is set by edemint-nvidia-toggle. Full effects are opt-in via
# ~/.config/hypr/effects.conf (edemint-setup writes it).

#############################
# Autostart
#############################
# First-build approximation of the pinned-app dock and top-right status region.
# The tap-in-void overlay, widgets, responsive mobile shell, and animations are
# intentionally deferred until the base system and static interactions work.
exec-once = waybar -c ~/.config/waybar/config -s ~/.config/waybar/style.css
exec-once = waybar -c ~/.config/waybar/config-dock -s ~/.config/waybar/style-dock.css
exec-once = mako
# Solid dark-mode background role from docs/PALETTE.md; the light-mode
# counterpart ships with the later theme-switch work.
exec-once = swaybg -c 171e54
exec-once = kanshi
exec-once = hypridle
exec-once = swayosd-server
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = fcitx5 -d
# Debian ships the polkit agent under /usr/lib/<triplet>/libexec/, so a
# fixed path never matches on either arch — locate it at session start.
exec-once = sh -c 'agent=$(find /usr/lib /usr/libexec -name polkit-kde-authentication-agent-1 2>/dev/null | head -n 1); [ -n "$agent" ] && exec "$agent"'
# Manual night-light schedule: a conscious default that works everywhere,
# unlike coordinates 0,0 (equatorial sunset times for every user).
exec-once = wlsunset -S 07:00 -s 20:00 -t 3800
# First-boot setup wizard (Wi-Fi, effects profile, AI opt-in, sync remote).
# Stamps itself after the first successful run; no-ops thereafter.
exec-once = foot -T "Edemint setup" -e edemint-setup
exec-once = edemint-welcome

#############################
# Input
#############################
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        drag_lock = true
        scroll_factor = 0.6
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 200
}

#############################
# Look & feel
#############################
general {
    gaps_in = 8
    gaps_out = 12
    border_size = 3
    # Flat fills only: gradients are forbidden by default (docs/DESIGN.md).
    col.active_border = $ed_primary
    col.inactive_border = $ed_surface
    layout = dwindle
}

dwindle {
    preserve_split = true
}

decoration {
    rounding = 16
    # Effects stay off on the default image. Capable profiles may override them.
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

# Effects profile. Sourced AFTER the low-power defaults above so its settings
# win. edemint-setup rewrites this file when the user picks "full" effects.
source = ~/.config/hypr/effects.conf

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true                # variable refresh on idle (power)
    vrr = 2                   # fullscreen-only VRR
    focus_on_activate = false # do not yank focus on toast/wake
}

#############################
# Keybinds
#############################
$mod = SUPER

# Apps
bind = $mod, Return, exec, foot
bind = $mod, D, exec, wofi --show drun
bind = $mod, E, exec, thunar
bind = $mod, A, exec, foot -T "Edemint AI" -e edemint-ai chat
bind = $mod, slash, exec, edemint-keybinds
bind = $mod SHIFT, slash, exec, edemint-keybinds

# Window management
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, T, togglesplit
bind = $mod, L, exec, hyprlock

# Move and resize — keyboard and mouse
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
binde = $mod CTRL, left, resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up, resizeactive, 0 -40
binde = $mod CTRL, down, resizeactive, 0 40
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Window groups (tabbed windows) + alt-tab
bind = $mod, G, togglegroup
bind = $mod ALT, right, changegroupactive, f
bind = $mod ALT, left, changegroupactive, b
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop

# Scratchpad (special workspace) — drop a terminal or notes anywhere
bind = $mod, grave, togglespecialworkspace, magic
bind = $mod SHIFT, grave, movetoworkspace, special:magic

# Quick settings + full settings hub
bind = $mod, S, exec, edemint-quick
bind = $mod, I, exec, edemint-settings

# Screenshot + clipboard + screen recording + color picker
bind = , Print, exec, mkdir -p "$HOME/Pictures" && grim "$HOME/Pictures/edemint-$(date +%Y%m%d-%H%M%S).png" && notify-send Edemint "Screenshot saved in ~/Pictures"
bind = $mod, Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send Edemint "Screenshot copied"
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod SHIFT, R, exec, pkill -SIGINT wf-recorder || wf-recorder -g "$(slurp)" -f "$HOME/Videos/edemint-$(date +%Y%m%d-%H%M%S).mp4"
bind = $mod SHIFT, C, exec, hyprpicker -a && notify-send Edemint "Color copied"

# Power menu
bind = $mod, Escape, exec, wlogout

# Accessibility - cursor zoom
binde = $mod, equal, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor -j | jq '.float + 0.1')"
binde = $mod, minus, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor -j | jq '.float - 0.1 | if . < 1 then 1 else . end')"
bind  = $mod, 0, exec, hyprctl keyword cursor:zoom_factor 1

# Focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Workspaces 1-9 and 0 (=10); Super+Tab bounces to the previous one and
# Super+scroll walks them in order.
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, Tab, workspace, previous
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Media keys (playerctl ships in the base desktop)
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Media / brightness - routed through swayosd for OSD feedback
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
