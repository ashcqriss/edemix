# Edemint — default Hyprland config.
#
# Two profiles: $low_power = true (default for Pi / 1GB-class) and the "full"
# profile (animations, rounding, blur, shadows) selected on capable hardware.
# Visual values (gaps, colors, anim curves) are placeholders; the design pass
# replaces them with the locked-in palette. Functional behaviour is final.

$low_power = true

#############################
# Monitors / AR glasses
#############################
# AR glasses (RayNeo Air, Xreal, …) attach over USB-C DP-Alt and present as
# an ordinary monitor (on PCs/laptops). kanshi (see ~/.config/kanshi/config)
# applies named profiles automatically on hotplug; the catch-all below covers
# everything else.
monitor = , preferred, auto, 1

#############################
# Session env
#############################
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1
# Input method (fcitx5 for CJK et al)
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = GNOME_ACCESSIBILITY,1
env = QT_ACCESSIBILITY,1
# Mesa shader cache — first-launch latency wins for GL apps (§optim).
env = MESA_SHADER_CACHE_MAX_SIZE,2G
env = mesa_glthread,true
# NVIDIA env is set by edemint-nvidia-toggle (env file lands under
# /etc/environment.d/ and is read by systemd-user sessions); flipping
# $low_power to false is for capable hardware.

#############################
# Autostart
#############################
exec-once = waybar
exec-once = mako
exec-once = swaybg -c 14161c
exec-once = kanshi
exec-once = hypridle
exec-once = swayosd-server
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = fcitx5 -d
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wlsunset -l 0 -L 0
exec-once = edemint-welcome

#############################
# Input
#############################
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        drag_lock = true
        scroll_factor = 0.6
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 200
}

#############################
# Look & feel
#############################
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 8
    # Effects gated on $low_power. Flip the variable above to enable.
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true                # variable refresh on idle (power)
    vrr = 2                   # fullscreen-only VRR (FreeSync/G-Sync wins)
    focus_on_activate = false # don't yank focus on toast/wake
}

#############################
# Keybinds
#############################
$mod = SUPER

# Apps
bind = $mod, Return, exec, foot
bind = $mod, D, exec, wofi --show drun
bind = $mod, E, exec, thunar
bind = $mod, A, exec, foot -T "Edemint AI" -e edemint-ai chat
bind = $mod, slash, exec, edemint-keybinds            # Super+? (US layout: ?)
bind = $mod SHIFT, slash, exec, edemint-keybinds

# Window mgmt
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, L, exec, hyprlock

# Screenshot + clipboard
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Power menu
bind = $mod, Escape, exec, wlogout

# Accessibility — cursor zoom (§10 magnifier)
binde = $mod, equal, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor -j | jq '.float + 0.1')"
binde = $mod, minus, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor -j | jq '.float - 0.1 | if . < 1 then 1 else . end')"
bind  = $mod, 0,     exec, hyprctl keyword cursor:zoom_factor 1

# Focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

# Media / brightness — routed through swayosd for OSD feedback (§9)
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

#############################
# Full-effects profile (capable hardware)
#############################
# Drop a one-line override file at ~/.config/hypr/profile.conf with:
#   $low_power = false
# and Hyprland will pick up animations, rounding, blur, shadows. The block
# below is wired but currently gated by $low_power == false (placeholder
# values — design pass tunes them).
source = ~/.config/hypr/profile.conf
