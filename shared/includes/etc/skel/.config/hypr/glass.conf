# Edemint "Full" effects profile — frosted + liquid glass.
#
# Sourced in place of the low-power baseline (effects.conf points here) so its
# keywords win. Everything below costs GPU — blur passes, vibrancy, shadows and
# motion — so it is intentionally NOT the default. Pi and 1GB-class hardware
# stay flat; edemint-setup's "Full" choice opts capable machines in.
#
# Two layers make the look:
#   - frosted glass: translucent surfaces the compositor blurs. Windows get it
#     from the opacity values here; the shell's panels, launcher, notifications
#     and power menu get it from the layerrule blur rules at the bottom.
#   - liquid glass: a bright, wet rim. `vibrancy` bleeds saturated colour through
#     the frost instead of a flat grey, and the active border is an
#     ultramarine -> azure -> turquoise gradient (the level-1 blue families in
#     docs/PALETTE.md) so the edge reads like light caught on glass.

decoration {
    # A wider radius than the 16px baseline reads as thicker, heavier glass.
    rounding = 18
    # Translucency is what makes the blur visible at all. Focused windows stay
    # legible; unfocused ones recede, which signals depth WITHOUT encoding state
    # by colour (a hard rule in docs/DESIGN.md).
    active_opacity = 0.94
    inactive_opacity = 0.86
    fullscreen_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.10

    blur {
        enabled = true
        size = 8
        passes = 3              # three passes = smooth frost with no banding
        new_optimizations = true
        ignore_opacity = true   # frost what is behind even opaque pixels
        xray = false            # blur other windows too, not only the wallpaper
        # vibrancy is the "liquid" tell: saturated colour leaks through the blur
        # rather than washing to grey. Keep darkness low so the glass reads
        # bright and wet instead of smoky.
        vibrancy = 0.30
        vibrancy_darkness = 0.05
        contrast = 1.05
        brightness = 1.0
        noise = 0.015           # faint grain — real frosted glass, not plastic
        popups = true
        popups_ignorealpha = 0.4
        special = true
    }

    # A soft, near-black cool shadow lifts each glass pane off the surface below.
    shadow {
        enabled = true
        range = 26
        render_power = 3
        color = rgba(05031acc)
        color_inactive = rgba(05031a66)
    }
}

# The wet rim. Three-stop blue gradient (C1 ultramarine -> C8a azure -> C7
# turquoise) at 45 degrees; inactive windows keep only a faint cool edge.
general {
    border_size = 2
    col.active_border = rgba(2001ffee) rgba(0080ffee) rgba(74fbeaee) 45deg
    col.inactive_border = rgba(171e5499)
}

# Motion tuned to feel like liquid settling: a quick ease-out for most things
# and a gentle overshoot for windows. Durations stay short to keep it snappy.
animations {
    enabled = true
    bezier = glassOut, 0.16, 1, 0.30, 1
    bezier = glassInOut, 0.45, 0, 0.20, 1
    bezier = liquid, 0.20, 0.90, 0.25, 1.04
    animation = windows, 1, 4, liquid, popin 6%
    animation = windowsOut, 1, 4, glassInOut, popin 6%
    animation = border, 1, 10, glassOut
    animation = fade, 1, 5, glassOut
    animation = workspaces, 1, 5, glassOut, slide
    animation = layers, 1, 4, glassOut, fade
}

# Frost the shell's own layer surfaces so the translucent panels match the
# window glass. `ignorealpha` keeps fully transparent regions (e.g. the gap
# around a floating bar) from being blurred into a haze. Namespaces follow each
# tool's layer-shell name; an unmatched name is simply a no-op.
layerrule = blur, waybar
layerrule = ignorealpha 0.2, waybar
layerrule = blur, wofi
layerrule = ignorealpha 0.3, wofi
layerrule = blur, notifications
layerrule = ignorealpha 0.3, notifications
layerrule = blur, logout_dialog
layerrule = ignorealpha 0.3, logout_dialog
layerrule = blur, swayosd
layerrule = ignorealpha 0.3, swayosd
