# Edemint terminal (foot) — light, Wayland-native.
# Colors follow docs/PALETTE.md: the terminal is an app, so its content sits
# on the near-black ink app background (dark set, #0C0F1D — never raw
# #000000) with the ANSI palette mapped
# onto Edemint families. ANSI black stays navy-950 so it remains visible.
font=JetBrains Mono:size=11
dpi-aware=yes

[cursor]
style=beam

[colors]
background=0c0f1d
foreground=e6e6e6
selection-background=002c89
selection-foreground=ffffff
## normal: navy / warm-red / plant / gold / azure / ultramarine / turquoise / gray
regular0=171e54
regular1=b32b2b
regular2=21920f
regular3=b67e29
regular4=0080ff
regular5=6d58ff
regular6=04a89d
regular7=e6e6e6
## bright: eco-gray / danger / eco / warning / ultramarine-200 / magenta / turquoise-200 / white
bright0=819c8d
bright1=e31515
bright2=45e289
bright3=e9de51
bright4=aea3ff
bright5=ff00c8
bright6=74fbea
bright7=ffffff
