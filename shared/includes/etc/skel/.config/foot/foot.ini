# Edemint terminal (foot) — light, Wayland-native, liquid glass.
font=JetBrains Mono:size=11
dpi-aware=yes

[cursor]
style=beam

[colors]
# Pure-black glass: slightly translucent so Hyprland's blur frosts whatever
# sits behind the terminal (docs/DESIGN.md). Low-power profiles that disable
# blur simply render this as near-black.
alpha=0.92
background=000000
foreground=e6e6e6
