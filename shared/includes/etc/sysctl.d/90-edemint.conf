# Edemint kernel tunings — desktop-tuned (§optimisations).

# Swap: zram is the primary swap (zramswap.service); the on-disk swapfile
# is rarely useful on a desktop. Default 60 is too eager.
vm.swappiness                 = 10
vm.vfs_cache_pressure         = 50

# btrfs/SSD-friendly dirty-page tuning — write back early, in small chunks.
vm.dirty_ratio                = 10
vm.dirty_background_ratio     = 5

# Network: BBR + fq_codel are measurably better on flaky / long-haul links.
net.core.default_qdisc        = fq_codel
net.ipv4.tcp_congestion_control = bbr

# Modest hardening (assert; many Trixie kernels have these by default).
kernel.kptr_restrict          = 2
kernel.dmesg_restrict         = 1
fs.protected_hardlinks        = 1
fs.protected_symlinks         = 1
fs.protected_fifos            = 2
fs.protected_regular          = 2

# Reasonable inotify limits — large editors / file watchers benefit.
fs.inotify.max_user_watches   = 524288
