# Edemint initramfs tuning — ship only the modules a given machine needs.
# `dep` autodetects from the running kernel + modaliases at update-initramfs
# time, instead of bundling every storage/net driver in Debian. Typical
# saving: 60-80MB initramfs → 15-25MB.
MODULES=dep

# zstd compression (faster + smaller than gz/xz at boot).
COMPRESS=zstd
