# Edemint initramfs tuning.
#
# Image builds generate initramfs files inside live-build/mmdebstrap chroots,
# where there is no real booted root device for initramfs-tools to inspect.
# MODULES=dep aborts there with "failed to determine device for /". Use the
# Debian default so both CI images build reliably and boot across hardware.
MODULES=most

# zstd compression (faster + smaller than gz/xz at boot).
COMPRESS=zstd