# Edemint GRUB defaults — read by grub-mkconfig in addition to
# /etc/default/grub. Override individual settings here without touching
# the Debian-shipped file.

GRUB_DISTRIBUTOR="Edemint"
GRUB_THEME="/boot/grub/themes/edemint/theme.txt"
GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu
GRUB_GFXMODE="auto"
GRUB_GFXPAYLOAD_LINUX="keep"
GRUB_DISABLE_OS_PROBER=false

# Quiet kernel boot — Plymouth handles the splash on amd64.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash mitigations=auto,nosmt nowatchdog"
