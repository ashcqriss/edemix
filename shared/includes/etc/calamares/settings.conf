---
# Edemint Calamares settings.
# Module sequence: welcome → locale → keyboard → partition (btrfs default)
# → users → packages → bootloader → unpackfs → grub → finished.
# The post-install finalize step drops the live user and disables greetd
# autologin (§6b/§6e).

modules-search: [ local, /usr/lib/calamares/modules ]

instances:
    - id:       packagecleanup
      module:   shellprocess
      config:   shellprocess-cleanup.conf
    - id:       finalize
      module:   shellprocess
      config:   shellprocess-finalize.conf

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - displaymanager
        - networkcfg
        - hwclock
        - services-systemd
        - bootloader-config
        - grubcfg
        - bootloader
        - packages
        - luksbootkeyfile
        - plymouthcfg
        - initramfscfg
        - initramfs
        - removeuser
        - shellprocess@finalize
    - show:
        - finished

branding: edemint
prompt-install: true
dont-chroot: false
