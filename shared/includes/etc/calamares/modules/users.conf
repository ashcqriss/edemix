---
# Edemint user creation — password-gated sudo, locked root (§6b/§6e).
defaultGroups:
    - users
    - sudo
    - audio
    - video
    - plugdev
    - netdev
    - input
    - bluetooth
    - lp
    - scanner
    - edemint-ar

autologinGroup:    autologin
sudoersGroup:      sudo
setRootPassword:   false
doAutologin:       false
passwordRequirements:
    minLength: 6
