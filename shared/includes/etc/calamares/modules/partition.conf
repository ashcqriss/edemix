---
# Edemint partition defaults — btrfs root pairs with snapper/grub-btrfs (§0g).
# Mount options: noatime (no read-time atime writes), compress=zstd:1 (fast
# transparent compression — typical 20-30% disk savings on text/code),
# ssd + discard=async (TRIM on, batched off the I/O path).
efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: 512MiB
userSwapChoices:
    - none
    - file
defaultFileSystemType:  btrfs
availableFileSystemTypes:  ["btrfs", "ext4", "f2fs", "xfs"]
enableLuksAutomatedPartitioning: true
allowManualPartitioning: true
initialPartitioningChoice: erase
initialSwapChoice: file
luksGeneration:         luks2
# Default to ENCRYPTED installs (§optim/security). User can untick at
# install time; the LUKS passphrase field shows up on the partition page.
initialEncryptionChoice: encrypted

mountOptions:
    default:    [ defaults, noatime ]
    btrfs:      [ defaults, noatime, compress=zstd:1, ssd, discard=async, space_cache=v2 ]
    btrfs_swap: [ defaults, noatime ]
    ext4:       [ defaults, noatime ]
    f2fs:       [ defaults, noatime ]
    xfs:        [ defaults, noatime ]
    efi:        [ defaults, umask=0077 ]
    swap:       [ defaults ]
