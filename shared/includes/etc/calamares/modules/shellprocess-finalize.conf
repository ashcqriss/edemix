---
# Edemint Calamares post-install finalize (§6b/§6e):
#   - assert root is locked
#   - rewrite greetd config to show the greeter (no autologin)
#   - re-create the edemint-ar group (defaultGroups already adds users to it,
#     but the group may not exist in the chroot)
#   - regenerate initramfs to pick up live → installed transition
dontChroot: false
timeout: 30
script:
    - command: "passwd -l root"
    - command: |
        cat > /etc/greetd/config.toml <<'TOML'
        [terminal]
        vt = 1

        [default_session]
        command = "tuigreet --time --remember --cmd Hyprland"
        user = "greetd"
        TOML
    - command: "getent group edemint-ar >/dev/null || groupadd --system edemint-ar"
    # Install-Edemint launcher is meaningless on an installed disk — the
    # Calamares binary itself is on the ISO only.
    - command: "rm -f /usr/share/applications/install-edemint.desktop"
    # Initialize snapper for the btrfs root so pre/post apt snapshots and
    # grub-btrfs entries work out of the box. Skips cleanly on non-btrfs.
    - command: |
        if findmnt -no FSTYPE / | grep -qx btrfs; then
            snapper -c root create-config / 2>/dev/null || true
            snapper -c root set-config TIMELINE_CREATE=yes TIMELINE_CLEANUP=yes 2>/dev/null || true
            systemctl enable snapper-timeline.timer snapper-cleanup.timer 2>/dev/null || true
            systemctl enable grub-btrfsd.service 2>/dev/null || true
        fi
    - command: "update-initramfs -u || true"
