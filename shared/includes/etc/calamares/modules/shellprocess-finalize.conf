---
# Edemint Calamares post-install finalize (§6b/§6e):
#   - assert root is locked
#   - rewrite greetd config to show the greeter (no autologin)
#   - re-create the edemint-ar group (defaultGroups already adds users to it,
#     but the group may not exist in the chroot)
#   - regenerate initramfs to pick up live → installed transition
dontChroot: false
timeout: 30
script:
    - command: "passwd -l root"
    - command: |
        cat > /etc/greetd/config.toml <<'TOML'
        [terminal]
        vt = 1

        [default_session]
        command = "tuigreet --time --remember --cmd Hyprland"
        user = "greetd"
        TOML
    - command: "getent group edemint-ar >/dev/null || groupadd --system edemint-ar"
    - command: "update-initramfs -u || true"
