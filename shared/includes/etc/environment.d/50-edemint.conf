# Edemint user-session environment defaults (§optimisations).
# Loaded for every systemd --user session.

# Mesa shader cache — big first-launch wins for GL apps. Default cap is 1G,
# raise to 2G so a few heavy games / Firefox / mpv share the cache.
MESA_SHADER_CACHE_DIR=$HOME/.cache/mesa_shader_cache
MESA_SHADER_CACHE_MAX_SIZE=2G

# Threaded GL — helps Mesa-only drivers; harmless elsewhere.
mesa_glthread=true

# Better fontconfig cache locality.
FONTCONFIG_PATH=/etc/fonts
