#!/usr/sbin/nft -f
# Edemint default firewall — deny-by-default inbound, allow outbound.
# Loopback unrestricted; ICMP/echo allowed; established/related allowed.
# Adjust per-app exceptions in /etc/nftables.conf.d/ drop-ins.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

        # DHCP client (lease replies)
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        # mDNS / SSDP / IPP / CUPS deliberately NOT opened: printing/sharing
        # is opt-in and stays bound to localhost (see cupsd.conf override).

        reject with icmpx type admin-prohibited
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
