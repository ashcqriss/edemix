# Edemint: do not gate boot on a routable IP.
# NetworkManager-wait-online.service is part of the default Debian setup
# and can stall boot for up to 30s on flaky networks. Wayland desktops
# don't need a routed network to reach a login prompt.
[Service]
# Replace the long --quit-after with an immediate exit.
ExecStart=
ExecStart=/bin/true
TimeoutStartSec=1
