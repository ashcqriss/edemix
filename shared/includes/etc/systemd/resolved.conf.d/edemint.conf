[Resolve]
# Edemint DNS defaults — DoT (DNS-over-TLS) with two unaffiliated providers.
# Override per-network in NetworkManager; these are the fallbacks.
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com
DNS=2620:fe::fe#dns.quad9.net 2606:4700:4700::1111#cloudflare-dns.com
DNSOverTLS=yes
DNSSEC=allow-downgrade
Cache=yes
DNSStubListener=yes
ReadEtcHosts=yes
