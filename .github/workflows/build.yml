name: build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed for the release-attachment job on tag pushes

jobs:
  lint:
    name: Tier A static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install lint deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make shellcheck nftables equivs gnupg apt-utils
      - name: Run Tier A lint
        run: make lint
      - name: Run signed-repo tamper test
        run: make sign-test

  iso:
    name: amd64 live ISO
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build equivs xorriso isolinux \
            debian-archive-keyring
      - name: Build ISO
        run: |
          set -o pipefail
          mkdir -p artifacts
          sudo ./build.sh amd64 2>&1 | tee artifacts/iso-build-full.log
      - name: Extract failing tail
        if: failure()
        run: |
          mkdir -p artifacts
          if [ -f artifacts/iso-build-full.log ]; then
            tail -300 artifacts/iso-build-full.log > artifacts/iso-build-tail.log
            echo "=== last 300 lines of the ISO build log ==="
            cat artifacts/iso-build-tail.log
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: edemint-iso-build-log
          path: artifacts/iso-build-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Collect artifacts
        run: |
          find profiles/amd64-iso -maxdepth 1 -name '*.iso' -exec cp {} artifacts/ \;
          ls -lh artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: edemint-amd64-iso
          path: artifacts/*.iso
          if-no-files-found: error
          retention-days: 14

  pi:
    name: arm64 Raspberry Pi image
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap qemu-user-static binfmt-support \
            genimage parted dosfstools mtools e2fsprogs xz-utils equivs \
            debian-archive-keyring gnupg curl
          sudo update-binfmts --enable qemu-aarch64 || true
      # Cache the downloaded arm64 .debs between runs. Key includes the
      # package-list hash so the cache invalidates when the lists change.
      # On a cache hit, mmdebstrap skips most of the download phase
      # (~10-15 minutes off the second+ run).
      - name: Restore apt-archives cache
        uses: actions/cache@v4
        with:
          path: profiles/arm64-pi/build/apt-cache
          key: pi-apt-cache-${{ hashFiles('shared/package-lists/**', 'profiles/arm64-pi/package-lists/**') }}
          restore-keys: |
            pi-apt-cache-
      - name: Build Pi image
        # Tee the full build log to a file and ALSO let it stream live
        # so the Actions UI still shows everything in real time.
        run: |
          set -o pipefail
          mkdir -p artifacts
          sudo ./build.sh pi 2>&1 | tee artifacts/pi-build-full.log
      # When the build fails, surface JUST the tail (last 300 lines) as a
      # tiny separate artifact you can download in one click. No more
      # scrolling 7000+ lines to find the actual error.
      - name: Extract failing tail
        if: failure()
        run: |
          mkdir -p artifacts
          if [ -f artifacts/pi-build-full.log ]; then
            tail -300 artifacts/pi-build-full.log > artifacts/pi-build-tail.log
            echo "=== last 300 lines of the Pi build log ==="
            cat artifacts/pi-build-tail.log
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: edemint-pi-build-log
          path: artifacts/pi-build-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Collect artifacts
        run: |
          find profiles/arm64-pi/build/images -maxdepth 1 -name '*.img.xz' -exec cp {} artifacts/ \;
          ls -lh artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: edemint-arm64-rpi-img
          path: artifacts/*.img.xz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Release + sign apt repo
    needs: [iso, pi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Sign apt-repo Release (real key)
        env:
          EDEMINT_APT_PRIVATE_KEY: ${{ secrets.EDEMINT_APT_PRIVATE_KEY }}
        run: |
          if [ -z "${EDEMINT_APT_PRIVATE_KEY:-}" ]; then
            echo "EDEMINT_APT_PRIVATE_KEY secret not set; skipping signed-repo publish."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y gnupg apt-utils
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$EDEMINT_APT_PRIVATE_KEY" | gpg --batch --import
          # Build the Edemint apt repo over the published metapackages and
          # sign the Release. The repo upload target (rsync/scp/s3) is
          # intentionally not hardcoded here — wire it in a follow-up once
          # the repo host is provisioned.
          mkdir -p repo/dists/trixie/main/binary-all repo/pool/main
          cp profiles/amd64-iso/config/packages.chroot/*.deb repo/pool/main/ || true
          (
            cd repo
            apt-ftparchive packages pool/main > dists/trixie/main/binary-all/Packages
            gzip -kf dists/trixie/main/binary-all/Packages
            apt-ftparchive release dists/trixie > dists/trixie/Release
            gpg --batch --yes --detach-sign --armor -o dists/trixie/Release.gpg dists/trixie/Release
            gpg --batch --yes --clearsign      -o dists/trixie/InRelease    dists/trixie/Release
          )
          tar -C repo -czf edemint-apt-repo.tar.gz .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/edemint-amd64-iso/*.iso
            dist/edemint-arm64-rpi-img/*.img.xz
            edemint-apt-repo.tar.gz
          generate_release_notes: true
