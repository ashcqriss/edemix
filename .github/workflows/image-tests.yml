name: Image functional tests

# Tests built images, not sources: boots the amd64 live ISO in QEMU until a
# login prompt appears on the serial console, and mounts the Raspberry Pi
# image to verify its firmware/rootfs contents and execute its arm64 Python
# through qemu-user emulation. Dispatch it with the run ID of a finished
# build; after merge to the default branch it also follows every green build.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run ID whose image artifacts to test (empty = newest green build on this branch)
        required: false
        type: string
  workflow_run:
    workflows: [build]
    types: [completed]
  push:
    branches: ["claude/**", main]
    paths: [".github/workflows/image-tests.yml"]

permissions:
  contents: read
  actions: read

concurrency:
  group: image-tests-${{ github.event.inputs.run_id || github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the build run to test
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.pick.outputs.run_id }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EXPLICIT: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -eu
          if [ -n "$EXPLICIT" ]; then
            echo "run_id=$EXPLICIT" >> "$GITHUB_OUTPUT"
            echo "testing explicitly requested build run $EXPLICIT"
            exit 0
          fi
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=$GITHUB_REF_NAME&status=success&per_page=1" \
            --jq '.workflow_runs[0].id')"
          test -n "$id" || {
            echo "no successful build run found on $GITHUB_REF_NAME" >&2
            exit 1
          }
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
          echo "testing newest green build run $id on $GITHUB_REF_NAME"

  iso-boot:
    name: Boot amd64 ISO to a login prompt
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: edemint-amd64-iso
          path: artifact
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install QEMU and ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 xorriso squashfs-tools

      - name: Verify design system inside the live filesystem
        run: |
          set -eu
          iso="$(find artifact -maxdepth 1 -name '*.iso' -print -quit)"
          test -n "$iso"
          # One extraction of /live provides the squashfs and packages list
          # here and the kernel/initrd for the boot step below.
          xorriso -osirrox on -indev "$iso" -extract /live live
          ls -la live/
          unsquashfs -l live/filesystem.squashfs > squashfs-list.txt
          for path in \
            squashfs-root/usr/share/edemint/design/hydroganic.css \
            squashfs-root/usr/share/edemint/design/edemint_design.py \
            squashfs-root/usr/libexec/edemint-settings-app \
            squashfs-root/usr/libexec/edemint-activity-monitor-app \
            squashfs-root/etc/skel/.config/gtk-4.0/gtk.css \
            squashfs-root/etc/skel/.config/gtk-3.0/gtk.css \
            squashfs-root/etc/skel/.config/hypr/hyprland.conf \
            squashfs-root/usr/share/applications/edemint-font-manager.desktop \
          ; do
            grep -Fxq "$path" squashfs-list.txt || {
              echo "missing in live filesystem: $path" >&2
              exit 1
            }
          done
          # The shipped Hyprland config must carry the 0.55 rule syntax and
          # the desktop entry rename from the bp_des_5 pass.
          unsquashfs -no-xattrs -d extracted live/filesystem.squashfs \
            etc/skel/.config/hypr/hyprland.conf \
            usr/share/applications/edemint-font-manager.desktop
          grep -q 'layerrule = blur on' extracted/etc/skel/.config/hypr/hyprland.conf
          grep -q '^Name=Fontbook' extracted/usr/share/applications/edemint-font-manager.desktop
          rm -f live/filesystem.squashfs

      - name: Boot the ISO in QEMU until login
        run: |
          set -eu
          iso="$(find artifact -maxdepth 1 -name '*.iso' -print -quit)"
          kernel="$(find live -maxdepth 1 -type f -name 'vmlinuz*' | sort | head -1)"
          initrd="$(find live -maxdepth 1 -type f -name 'initrd*' | sort | head -1)"
          echo "kernel: $kernel"
          echo "initrd: $initrd"
          test -s "$kernel"
          test -s "$initrd"
          accel=tcg
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            [ -w /dev/kvm ] && accel=kvm
          fi
          echo "QEMU acceleration: $accel"
          qemu-system-x86_64 \
            -machine q35,accel=$accel -cpu max -m 2048 -smp 2 \
            -kernel "$kernel" -initrd "$initrd" \
            -append "boot=live components hostname=edemint username=edemint console=ttyS0,115200 systemd.show_status=1" \
            -drive file="$iso",media=cdrom,readonly=on \
            -display none -serial file:serial.log \
            -daemonize -pidfile qemu.pid
          booted=""
          for _ in $(seq 1 90); do
            if grep -aq "edemint login:" serial.log; then
              booted=yes
              break
            fi
            if grep -aqE "Kernel panic|\(initramfs\)" serial.log; then
              echo "boot failed with panic or initramfs emergency shell" >&2
              break
            fi
            sleep 10
          done
          kill "$(cat qemu.pid)" 2>/dev/null || true
          echo "---- serial log tail ----"
          tail -60 serial.log || true
          test -n "$booted" || {
            echo "live system did not reach a login prompt" >&2
            exit 1
          }
          echo "ISO booted to a login prompt under $accel."

      - name: Verify app runtime packages in the live image
        run: |
          set -eu
          # filesystem.packages lists Multi-Arch: same packages with an
          # architecture qualifier (name:amd64), so match both forms.
          awk '{print $1}' live/filesystem.packages > pkg-names.txt
          fail=""
          for pkg in python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-webkit-6.0 \
                     nheko geary gnome-maps gnome-contacts webcamoid; do
            if grep -Fxq -e "$pkg" -e "$pkg:amd64" pkg-names.txt; then
              echo "present: $pkg"
            else
              echo "MISSING: $pkg" >&2
              fail=1
            fi
          done
          test -z "$fail"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: iso-boot-serial-log
          path: serial.log
          if-no-files-found: warn
          retention-days: 7

  pi-userspace:
    name: Verify Pi image rootfs and arm64 userspace
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: edemint-arm64-rpi-img
          path: artifact
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zstd qemu-user-static binfmt-support

      - name: Mount partitions and verify contents
        run: |
          set -eu
          archive="$(find artifact -maxdepth 1 -name '*.img.zst' -print -quit)"
          test -n "$archive"
          zstd -d --rm "$archive" -o edemint-rpi.img
          device="$(sudo losetup -Pf --show edemint-rpi.img)"
          mkdir -p firmware rootfs
          sudo mount -o ro "${device}p1" firmware
          sudo mount -o ro "${device}p2" rootfs
          echo "---- firmware partition ----"
          ls firmware | head -20
          test -f firmware/config.txt
          test -f firmware/cmdline.txt
          echo "---- rootfs design and app suite ----"
          test -f rootfs/usr/share/edemint/design/hydroganic.css
          test -f rootfs/usr/share/edemint/design/edemint_design.py
          test -f rootfs/usr/libexec/edemint-settings-app
          test -f rootfs/etc/skel/.config/gtk-4.0/gtk.css
          grep -q 'layerrule = blur on' rootfs/etc/skel/.config/hypr/hyprland.conf
          grep -q '^Name=Fontbook' rootfs/usr/share/applications/edemint-font-manager.desktop
          grep -q '^Name=Advanced Camera' rootfs/usr/share/applications/edemint-camera-studio.desktop

      - name: Execute the image's arm64 userspace through qemu-user
        run: |
          set -eu
          echo "---- app runtime stack ----"
          sudo chroot rootfs /usr/bin/dpkg-query -W \
            -f='${Package} ${Version} ${db:Status-Status}\n' \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 2>&1 | tee stack.txt
          for pkg in python3-gi gir1.2-gtk-4.0 gir1.2-adw-1; do
            grep -Eq "^$pkg .* installed$" stack.txt || {
              echo "missing runtime package in Pi image: $pkg" >&2
              exit 1
            }
          done
          echo "---- arm64 python executes ----"
          sudo chroot rootfs /usr/bin/python3 - <<'PY'
          import platform
          import sys

          for path in (
              "/usr/share/edemint/design/edemint_design.py",
              "/usr/libexec/edemint-settings-app",
              "/usr/libexec/edemint-activity-monitor-app",
          ):
              with open(path, encoding="utf-8") as handle:
                  compile(handle.read(), path, "exec")
          print("arm64 python", sys.version.split()[0], "on", platform.machine(),
                "compiled the design runtime and apps")
          PY
