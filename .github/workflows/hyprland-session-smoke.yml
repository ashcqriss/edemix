name: Hyprland session smoke

on:
  workflow_dispatch:
  push:
    branches:
      - codex/app-foundations-roadmap
    paths:
      - .github/workflows/hyprland-session-smoke.yml
      - scripts/smoke-hyprland-session.sh
      - shared/includes/etc/greetd/config.toml
      - shared/includes/etc/skel/.config/hypr/**
      - shared/includes/usr/share/edemint/required-desktop.packages
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/hyprland-session-smoke.yml
      - scripts/smoke-hyprland-session.sh
      - shared/includes/etc/greetd/config.toml
      - shared/includes/etc/skel/.config/hypr/**
      - shared/includes/usr/share/edemint/required-desktop.packages

permissions:
  contents: read

concurrency:
  group: hyprland-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-session:
    name: Virtual DRM login and Wayland session
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Provision virtual DRM device
        id: drm
        shell: bash
        run: |
          set -euo pipefail
          drm_device=""
          for status_file in /sys/class/drm/card[0-9]*-*/status; do
            [ -r "$status_file" ] || continue
            [ "$(cat "$status_file")" = connected ] || continue
            connector="$(basename "$(dirname "$status_file")")"
            card="${connector%%-*}"
            candidate="/dev/dri/$card"
            if [ -c "$candidate" ]; then
              drm_device="$candidate"
              break
            fi
          done
          if [ -z "$drm_device" ]; then
            if ! sudo modprobe vkms; then
              sudo apt-get update
              sudo apt-get install -y "linux-modules-extra-$(uname -r)"
              sudo modprobe vkms
            fi
            sudo udevadm settle
            for status_file in /sys/class/drm/card[0-9]*-*/status; do
              [ -r "$status_file" ] || continue
              [ "$(cat "$status_file")" = connected ] || continue
              connector="$(basename "$(dirname "$status_file")")"
              candidate="/dev/dri/${connector%%-*}"
              if [ -c "$candidate" ]; then
                drm_device="$candidate"
                break
              fi
            done
          fi
          test -c "$drm_device"
          echo "device=$drm_device" >> "$GITHUB_OUTPUT"
          echo "Using virtual DRM device $drm_device"
          ls -l /dev/dri
          for sys_device in /sys/class/drm/card[0-9]*; do
            [ -e "$sys_device" ] || continue
            printf '%s driver=%s\n' "$sys_device" "$(basename "$(readlink -f "$sys_device/device/driver" 2>/dev/null || true)")"
          done

      - name: Start and inspect Hyprland session
        env:
          EDEMINT_DRM_DEVICE: ${{ steps.drm.outputs.device }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -e EDEMINT_DRM_DEVICE \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            debian:trixie sh -eu -c '
              cat > /etc/apt/sources.list.d/backports.sources <<"EOF"
          Types: deb
          URIs: http://deb.debian.org/debian
          Suites: trixie-backports
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          EOF
              apt-get update -o Acquire::Languages=none
              apt-get install -y --no-install-recommends -t trixie-backports hyprland
              apt-get install -y --no-install-recommends \
                dbus-x11 foot jq libgl1-mesa-dri procps seatd
              sh scripts/smoke-hyprland-session.sh
            '
